[workspace]
members = ["crates/island-core", "crates/island-ui", "crates/island-windows", "crates/island-app"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"

[workspace.dependencies]
windows-future = "=0.3.2"
windows = { version = "=0.62.2", features = ["Foundation", "Media_Control", "Storage_Streams", "Graphics_Imaging", "Win32_System_WinRT", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Registry", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

